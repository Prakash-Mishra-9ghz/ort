name: Docker Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  REGISTRY: ghcr.io
  REPO_OWNER: prakash-mishra-9ghz

jobs:
  disk_space:
    name: Docker Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Free Disk Space
        uses: ./.github/actions/free-disk-space
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4
      - name: Get ORT version
        run: |
          ORT_VERSION=$(./gradlew -q printVersion)
          echo "ORT_VERSION=${ORT_VERSION}" >> $GITHUB_ENV
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Metadata for 'ort' Docker Image
        id: meta-ort
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/ort
          tags: |
            type=pep440,pattern={{version}}
            type=raw,value=${{ env.ORT_VERSION }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha
      - name: Build & Push 'ort' Docker Image
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          push: false
          tags: ${{ steps.meta-ort.outputs.tags }}
          labels: ${{ steps.meta-ort.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/ort:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/ort:cache,mode=max
          build-args: ORT_VERSION=${{ env.ORT_VERSION }}
          sbom: true
      - name: Build 'ort' Docker Image
        if: ${{ github.event_name == 'pull_request' || github.repository != 'prakash-mishra-9ghz/your-repo-name' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ort-dev:local
          push: false
          build-args: ORT_VERSION=${{ env.ORT_VERSION }}
          sbom: true
      - name: Extract Metadata for 'ort-minimal' Docker Image
        id: meta-ort-minimal
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/ort-minimal
          tags: |
            type=pep440,pattern={{version}}
            type=raw,value=${{ env.ORT_VERSION }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha
      - name: Build & Push 'ort-minimal' Docker Image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          # Do not "cache-to" here to not overwrite additional layers from the "full" image, which also contains all
          # layers present in the "minimal" image anyway.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-ort-minimal.outputs.tags }}
          labels: ${{ steps.meta-ort-minimal.outputs.labels }}
          target: minimal
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/ort:cache
          build-args: ORT_VERSION=${{ env.ORT_VERSION }}
          sbom: true

      # Save image tarball for artifact
      - name: Save Docker image as tarball
        run: |
          echo "Meta-ort tags: ${{ steps.meta-ort.outputs.tags }}"
          TAG=$(echo "${{ steps.meta-ort.outputs.tags }}" | awk '{print $1}')
          echo "Using tag: $TAG"
          if [ -z "$TAG" ]; then
            echo "No tag found, creating image locally for save..."
            # Save the image you just built with a fixed name, e.g. ort-dev:local
            docker save ort-dev:local -o ort-dev-image.tar || exit 1
          else
            docker pull $TAG || echo "Pull failed, image might not be pushed yet"
            docker save $TAG -o ort-dev-image.tar
          fi

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ort-dev-image
          path: ort-dev-image.tar

      - name: Print Disk Space
        run: df -h
